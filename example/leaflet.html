<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      .map {
        height: 800px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map" class="map"></div>
    <script type="module">
      import { STAM } from "../dist/stam-leaflet.js";
      var map2 = L.map("map", {
        preferCanvas: true,
      }).setView([50.27264, 7.26469], 8);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map2);

      STAM({
        //baseUrl: "https://airquality-frost.docker01.ilt-dmz.iosb.fraunhofer.de/v1.1",
        //baseUrl: "https://sensorthings.brgm-rec.fr/SensorThingsGroundWater/v1.0",
        //baseUrl: "https://service.datacove.eu/DemographyThings/v1.1",
        //baseUrl: "https://service.datacove.eu/HydroThings/v1.1",
        baseUrl: "https://airquality-frost.k8s.ilt-dmz.iosb.fraunhofer.de/v1.1",
        markerStyle: function (feature) {
          return "yellow";
        },

        clusterStyle: {
          circle: {
            color: "#4338ca",
            weight: 2,
            opacity: 0.9,
            fillColor: "#ffffff",
            fillOpacity: 0.85,
          },
          polygon: {
            default: {
              color: "#6366f1",
              weight: 1,
              opacity: 0.45,
              fillColor: "#6366f1",
              fillOpacity: 0.1,
            },
            hover: {
              color: "#4338ca",
              weight: 2,
              opacity: 0.95,
              fillColor: "#6366f1",
              fillOpacity: 0.25,
            },
          },
        },
        cluster: true,
        // cachingDuration: 10,
        clusterMin: 5,
        queryObject: {
          entityType: "Things",
        },
      }).addTo(map2);
    </script>
  </body>
</html>
