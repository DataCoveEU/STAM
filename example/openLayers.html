<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/ol@v10.10.0/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.10.0/ol.css" />
    <style>
      .map {
        height: 800px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <!-- <div id="map" class="map"></div> -->
    <div id="mapOl" class="map"></div>
    <script type="module">
      import { STAM } from "../dist/stam-openlayers.js";

      var map = new ol.Map({
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM(),
          }),
        ],
        target: "mapOl",
        view: new ol.View({
          center: [808701.59, 6493626.85],
          zoom: 8,
        }),
      });

      map.addLayer(
        new STAM({
          //baseUrl: "https://airquality-frost.docker01.ilt-dmz.iosb.fraunhofer.de/v1.1",
          //baseUrl: "https://sensorthings.brgm-rec.fr/SensorThingsGroundWater/v1.0",
          //baseUrl: "https://service.datacove.eu/DemographyThings/v1.1",
          //baseUrl: "https://service.datacove.eu/HydroThings/v1.1",
          baseUrl: "https://airquality-frost.k8s.ilt-dmz.iosb.fraunhofer.de/v1.1",
          markerStyle: function (feature) {
            return "yellow";
          },
          markerClick: (marker) => {
            var s = "";
            return s;
          },
          cluster: true,
          // cachingDuration: 10,
          clusterMin: 5,
          queryObject: {
            entityType: "Things",
          },
          map,
        }),
      );
    </script>
  </body>
</html>
