name: Test and Release
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        name: Install Node.js and pnpm
        with:
          cache: ${{ github.ref != 'refs/heads/main' }}
          install: false

      - name: Install dependencies
        run: pnpm install
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint
      - name: Run tests
        run: pnpm test
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run build
        run: pnpm build

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release reads the tags and history to pick the version

      - uses: pnpm/setup@v1
        name: Install Node.js and pnpm
        with:
          cache: false
          install: false

      # @semantic-release/npm leaves the trusted publishing token exchange to the npm CLI,
      # so the CLI bundled with the Node version above may be too old for it
      - name: Update the npm CLI
        run: |
          npm install --global npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install
      # The published package ships dist, so it has to be built in this job too
      - name: Run build
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release
